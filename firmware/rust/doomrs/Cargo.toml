[package]
name = "doomrs"
version = "0.1.0"
edition = "2021"
description = "B83: Doom engine in Rust (no_std staticlib), drop-in for the C doomp4 component; bit-exact with it (lab:LEAD/B83 oracle)"

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = 1
