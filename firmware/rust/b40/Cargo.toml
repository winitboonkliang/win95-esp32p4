[package]
name = "b40"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
capi = []
fw = ["capi"]   # no_std, C ABI, for the Win95 firmware (base/)
board = []   # no_std build for the P4

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
